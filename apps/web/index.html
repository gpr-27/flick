<!doctype html>
<html lang="en" data-theme="pastel-glass">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover → enables env(safe-area-inset-*) on notched devices.
         interactive-widget=resizes-content → the on-screen keyboard resizes the
         layout so the message input stays visible above it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#F5F4FA" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iPhone and iPad: run full screen from the home screen, with this name and a clear status bar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Flick" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Apply the saved appearance (Settings > Appearance) before first paint to avoid a flash.
         Kept in sync with src/features/settings/appearance.ts (a test compares the two). -->
    <script>
      (function () {
        try {
          var saved = {};
          try {
            saved = JSON.parse(localStorage.getItem('flick.settings.v1') || '{}').state || {};
          } catch (e) {}
          var media = function (q) {
            return !!(window.matchMedia && window.matchMedia(q).matches);
          };
          var theme = saved.theme || localStorage.getItem('chat-theme');
          var dark =
            theme === 'dark' || (theme !== 'light' && media('(prefers-color-scheme: dark)'));
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'pastel-night' : 'pastel-glass');
          root.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#121019' : '#F5F4FA');
          var accents = {
            blue: '58.69% 0.2079 260',
            green: '61.3% 0.1307 157.82',
            orange: '65.99% 0.1832 45.61',
            pink: '62.11% 0.218 355.32',
            teal: '59.94% 0.1013 185.77',
          };
          if (accents[saved.accent]) {
            root.style.setProperty('--p', accents[saved.accent]);
            root.style.setProperty('--pc', '100% 0 0');
          }
          var families = {
            system:
              "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Helvetica Neue', Inter, system-ui, sans-serif",
            serif: "Georgia, 'Times New Roman', serif",
            mono: "ui-monospace, 'SF Mono', Menlo, Consolas, monospace",
          };
          var family = saved.fontFamily || 'serif';
          if (families[family]) {
            root.style.setProperty('--app-font', families[family]);
            root.style.setProperty('--display-font', families[family]);
          }
          var sizes = { small: 14, large: 18, xlarge: 20 };
          var size = saved.fontSize || 'small';
          if (sizes[size]) root.style.fontSize = sizes[size] + 'px';
          root.setAttribute(
            'data-density',
            saved.density === 'compact' ? 'compact' : 'comfortable',
          );
          root.setAttribute('data-corners', saved.corners === 'sharp' ? 'sharp' : 'rounded');
          root.setAttribute(
            'data-motion',
            saved.reduceMotion === true || media('(prefers-reduced-motion: reduce)')
              ? 'reduce'
              : 'full',
          );
        } catch (e) {}
      })();
    </script>

    <title>Flick — Realtime Messaging</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
