<!doctype html>
<html lang="en" data-theme="pastel-glass">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover → enables env(safe-area-inset-*) on notched devices.
         interactive-widget=resizes-content → the on-screen keyboard resizes the
         layout so the message input stays visible above it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#F4F3FA" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iPhone and iPad: run full screen from the home screen, with this name and a clear status bar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Flick" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Apply the saved appearance (Settings > Appearance) before first paint to avoid a flash.
         Kept in sync with src/features/settings/appearance.ts (a test compares the two). -->
    <script>
      (function () {
        try {
          var saved = {};
          try {
            saved = JSON.parse(localStorage.getItem('flick.settings.v1') || '{}').state || {};
          } catch (e) {}
          var media = function (q) {
            return !!(window.matchMedia && window.matchMedia(q).matches);
          };
          var theme = saved.theme || localStorage.getItem('chat-theme');
          var dark =
            theme === 'dark' || (theme !== 'light' && media('(prefers-color-scheme: dark)'));
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'pastel-night' : 'pastel-glass');
          root.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#14111F' : '#F4F3FA');
          var accents = {
            blue: '217 91% 55%',
            green: '152 60% 38%',
            orange: '24 90% 48%',
            pink: '330 75% 55%',
            teal: '175 75% 33%',
          };
          if (accents[saved.accent]) {
            root.style.setProperty('--p', accents[saved.accent]);
            root.style.setProperty('--pc', '0 0% 100%');
          }
          var families = {
            system: "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif",
            serif: "Georgia, 'Times New Roman', serif",
            mono: "ui-monospace, 'SF Mono', Menlo, Consolas, monospace",
          };
          var family = saved.fontFamily || 'serif';
          if (families[family]) {
            root.style.setProperty('--app-font', families[family]);
            root.style.setProperty('--display-font', families[family]);
          }
          var sizes = { small: 14, large: 18, xlarge: 20 };
          var size = saved.fontSize || 'small';
          if (sizes[size]) root.style.fontSize = sizes[size] + 'px';
          root.setAttribute(
            'data-density',
            saved.density === 'compact' ? 'compact' : 'comfortable',
          );
          root.setAttribute('data-corners', saved.corners === 'sharp' ? 'sharp' : 'rounded');
          root.setAttribute(
            'data-motion',
            saved.reduceMotion === true || media('(prefers-reduced-motion: reduce)')
              ? 'reduce'
              : 'full',
          );
        } catch (e) {}
      })();
    </script>

    <!-- Soft Pastel Glass type: Quicksand (rounded display) + Nunito (rounded body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
      rel="stylesheet"
    />

    <title>Flick — Realtime Messaging</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
