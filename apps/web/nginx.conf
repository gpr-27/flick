server {
  listen 8080;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # Hashed build assets never change: cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: unknown paths load index.html so client routes work on refresh.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
