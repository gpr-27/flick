# Edge proxy for compose.prod.yml: the single public entry point in front of
# the api replicas (HTTP + WebSocket) and the web app.
#
# No sticky sessions: any api replica can serve any request or socket, because
# replicas route live messages to each other through Redis and all durable
# state is in Postgres.
#
# TLS is terminated by the load balancer in front of this proxy (refresh
# cookies are Secure, so the public site must be HTTPS).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 10240;
}

http {
  include /etc/nginx/mime.types;
  # $uri has no query string, so nothing sensitive in a URL reaches the logs.
  log_format main '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time "$upstream_addr"';
  access_log /dev/stdout main;
  server_tokens off;

  # Docker's DNS. `resolve` below re-reads it, so restarted or added api
  # replicas are picked up without reloading nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api {
    zone upstream_api 64k;
    server api:3000 resolve;
    keepalive 32;
  }

  upstream web {
    zone upstream_web 64k;
    server web:8080 resolve;
  }

  # Only send "Connection: upgrade" when the client asked for a WebSocket.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  # API bodies are small JSON. Media goes straight to object storage through
  # presigned URLs and never passes through here.
  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 65s;

  gzip on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Metrics and readiness are for Prometheus and Docker on the internal
    # network only.
    location ~ /metrics$ { return 404; }
    location = /health/ready { return 404; }

    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    # Socket.IO (WebSocket, or long polling first). The read timeout must be longer than its ping
    # interval (25 s), or nginx would close idle but healthy sockets.
    location /socket.io/ {
      proxy_pass http://api;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # The API serves its routes at the root, so the /api prefix is cut off (the slash after "api").
    location /api/ {
      proxy_pass http://api/;
      # Lets streamed AI answers (SSE) reach the browser as they are produced.
      proxy_buffering off;
    }

    location = /health/live {
      proxy_pass http://api;
    }

    location / {
      proxy_pass http://web;
    }
  }
}
