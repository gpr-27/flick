# Used by both compose.yml and compose.prod.yml.
#
# api and worker are found through Docker DNS, so each replica (2 api replicas
# in prod) becomes its own target with its own `instance` label.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - { names: [api], type: A, port: 3000 }

  - job_name: worker
    dns_sd_configs:
      - { names: [worker], type: A, port: 3002 }

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]
