# Production-like stack on one host: nginx in front of 2 api replicas, plus the
# worker, the web app, the data stores and the monitoring stack.
#
#   docker compose -f infra/docker/compose.prod.yml --env-file .env.prod up -d --build
#
# Differences from compose.yml:
#   - secrets have no defaults: compose refuses to start until they are set;
#   - only nginx and coturn are reachable from outside; admin UIs listen on
#     127.0.0.1 (use an SSH tunnel);
#   - containers restart automatically and logs are rotated.
#
# Postgres and MinIO are still single nodes here. Real production
# would use managed or replicated versions of them.

name: chat-prod

x-logging: &logging
  driver: json-file
  options: { max-size: '20m', max-file: '5' }

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgres://chat:${POSTGRES_PASSWORD:?required}@postgres:5432/chat
  DATABASE_POOL_MAX: 20
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?required (public URL browsers use for media)}
  S3_REGION: us-east-1
  S3_BUCKET: chat-media
  S3_ACCESS_KEY_ID: chat-app
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
  S3_FORCE_PATH_STYLE: 'true'
  TURN_SECRET: ${TURN_SECRET:?required}
  TURN_URLS: ${TURN_URLS:?required, e.g. turn:turn.example.com:3478?transport=udp}
  CORS_ORIGINS: ${PUBLIC_ORIGIN:?required, e.g. https://chat.example.com}
  # Behind nginx: trust X-Forwarded-For / X-Forwarded-Proto.
  TRUST_PROXY: 'true'

x-app-depends: &app-depends
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }
  minio-init: { condition: service_completed_successfully }

x-app-healthcheck: &app-healthcheck
  test:
    [
      'CMD',
      'node',
      '-e',
      "fetch('http://127.0.0.1:'+process.env.PORT+'/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
    ]
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  # ── Edge ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    volumes: [../nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    ports: ['${HTTP_PORT:-80}:8080']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/nginx-health']
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    logging: *logging
    restart: always

  # ── Applications ─────────────────────────────────────────────────────────
  api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    image: chat-api
    env_file: [{ path: ../../.env.prod, required: false }]
    environment:
      <<: *app-env
      PORT: '3000'
      API_PORT: '3000' # the api reads API_PORT; PORT is only used by the healthcheck
    # No published port: traffic arrives through nginx only. Each replica
    # uses its container hostname as its gateway id.
    deploy: { replicas: 2 }
    healthcheck: *app-healthcheck
    depends_on: *app-depends
    stop_grace_period: 30s
    logging: *logging
    restart: always

  worker:
    build: { context: ../.., dockerfile: apps/worker/Dockerfile }
    image: chat-worker
    env_file: [{ path: ../../.env.prod, required: false }]
    environment:
      <<: *app-env
      PORT: '3002'
      WORKER_METRICS_PORT: '3002' # the worker reads this; PORT is only used by the healthcheck
    healthcheck: *app-healthcheck
    depends_on: *app-depends
    stop_grace_period: 30s
    logging: *logging
    restart: always

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      # Same origin as the api (through nginx), so relative URLs work.
      args: { VITE_API_URL: /api }
    image: chat-web
    logging: *logging
    restart: always

  # ── Data stores ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    # Sized for a host with ~4 GB RAM for Postgres. Slow queries (>250 ms) are logged.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=250
      # A forgotten open transaction holds locks and blocks vacuum; kill it.
      - -c
      - idle_in_transaction_session_timeout=60s
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: chat
    shm_size: 256m
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'chat', '-d', 'chat']
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 60s
    logging: *logging
    restart: always

  redis:
    image: redis:7-alpine
    # Ephemeral state only. Every key has a TTL, so under memory pressure
    # volatile-lru evicts expiring state instead of refusing writes.
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '512mb',
        '--maxmemory-policy',
        'volatile-lru',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging
    restart: always

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_ORIGIN:?required}
    ports:
      # Browsers upload/download here with presigned URLs. Put TLS in front of
      # it and set S3_PUBLIC_ENDPOINT to that public URL.
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging
    restart: always

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    entrypoint: ['/bin/sh', '/init/init-bucket.sh']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      S3_BUCKET: chat-media
      S3_ACCESS_KEY_ID: chat-app
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
    volumes: [../minio/init-bucket.sh:/init/init-bucket.sh:ro]
    depends_on:
      minio: { condition: service_healthy }
    logging: *logging

  coturn:
    image: coturn/coturn:4.6.3
    # Host networking: TURN needs a wide UDP port range and the real public IP;
    # Docker's port proxy would add latency and hide client addresses.
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?required}
      - --realm=${TURN_REALM:?required}
      - --listening-port=3478
      - --min-port=49152
      - --max-port=65535
      - --external-ip=${TURN_EXTERNAL_IP:?required (public IP of this host)}
      - --no-cli
      - --no-tls
      - --no-dtls
      # Never relay into private networks: TURN must not become a way to reach
      # internal services.
      - --no-loopback-peers
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
    healthcheck:
      test: ['CMD', 'turnutils_stunclient', '127.0.0.1']
      interval: 15s
      timeout: 5s
      retries: 4
    logging: *logging
    restart: always

  # ── Observability ────────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_URI: postgres:5432/chat?sslmode=disable
      DATA_SOURCE_USER: chat
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?required}
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging
    restart: always

  redis-exporter:
    image: oliver006/redis_exporter:v1.69.0
    environment: { REDIS_ADDR: 'redis://redis:6379' }
    depends_on:
      redis: { condition: service_healthy }
    logging: *logging
    restart: always

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:9090:9090']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:9090/-/ready']
      interval: 15s
      timeout: 5s
      retries: 6
    logging: *logging
    restart: always

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ['127.0.0.1:3001:3000']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 6
    depends_on:
      prometheus: { condition: service_healthy }
    logging: *logging
    restart: always

volumes:
  pg-data:
  minio-data:
  prometheus-data:
  grafana-data:
